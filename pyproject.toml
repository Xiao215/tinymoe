[project]
name = "tinylab"
version = "0.1.0"
description = "End-to-end LLM lab: pre-training, mid-training, SFT, DPO, GRPO-family RL and distillation on a small MoE transformer, with a live viewer."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "torch>=2.4",
    "numpy>=1.26",
    "tokenizers>=0.19",
    "datasets>=2.19",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
viewer = ["fastapi>=0.110", "uvicorn>=0.29"]
cuda = []
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.3",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "httpx>=0.27",
    "pre-commit>=3.7",
]

[project.scripts]
tinylab = "tinylab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tinylab", "viewer"]

[tool.uv]
default-groups = []

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["viewer/web", "runs", "data_cache"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "T20", "N", "PTH"]
ignore = ["N812", "N806", "RUF001", "RUF002", "RUF003", "N803"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20"]
"tinylab/tools/*.py" = ["T20"]
"tinylab/cli.py" = ["T20"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["tinylab", "viewer/server"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["datasets.*", "tokenizers.*", "uvicorn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
timeout = 600
filterwarnings = ["error::RuntimeWarning:tinylab.*"]
markers = ["slow: longer-running tests", "distributed: multi-process gloo tests"]
