# Distillation recipe: the lineage model teaches `student`. train.* is each student mode's
# budget (same for all, so the comparison is fair); the student base pre-trains first.
stage: {name: distill, init_from: auto}
train:
  optimizer: muon
  lr: 1e-3
  schedule: wsd
  warmup_steps: 20
  decay_frac: 0.3
  weight_decay: 0.0
distill:
  modes: [baseline, offpolicy, logit, onpolicy]
  student_pretrain_steps: 300
  student_lr: 3e-3
  teacher_prompts: 1000
  teacher_samples_per_prompt: 4
  teacher_temperature: 0.8
  kd_temperature: 1.0
  kd_ce_weight: 0.0
  onpolicy_steps: 100
  onpolicy_prompts_per_step: 16
  onpolicy_lr: 2e-4
  onpolicy_max_new_tokens: 96
